<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>共有されたデッキ ― PokeDeck</title>
<meta name="description" content="PokeDeck で共有されたポケモンカードのデッキ。アプリを入れていれば、そのまま自分のデッキとして取り込めます。">
<meta property="og:title" content="共有されたデッキ ― PokeDeck">
<meta property="og:description" content="ポケモンカードのデッキが共有されました。アプリで開くとそのまま取り込めます。">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* 色と字はアプリ紹介ページ（web/index.html）と同じものを使う。
     共有リンクを踏んだ人が最初に見る画面なので、別のサイトに見えては困る。 */
  :root {
    --bg: #0F0E15;
    --surface: #1F1E2A;
    --surface2: #171622;
    --surface3: #292735;
    --text: #F2F0F7;
    --text2: #A9A5B8;
    --text3: #6F6B80;
    --accent: #C9B6FF;
    --accent-strong: #A98BFF;
    --gold: #F2C14E;
    --line: rgba(255,255,255,0.08);
    --deck: var(--accent-strong);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  .glow {
    position: fixed; left: 50%; top: -320px;
    width: 760px; height: 760px; margin-left: -380px;
    border-radius: 50%; pointer-events: none; z-index: 0;
    background: radial-gradient(circle, color-mix(in srgb, var(--deck) 22%, transparent) 0%, rgba(15,14,21,0) 70%);
  }

  .wrap { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 0 20px 64px; }

  .eyebrow {
    font-family: 'Sora', sans-serif; font-weight: 700;
    font-size: 12px; letter-spacing: 0.18em; color: var(--accent);
    text-transform: uppercase;
  }

  header.top { padding: 28px 0 8px; }
  h1 {
    font-weight: 900; font-size: 34px; line-height: 1.3;
    margin: 12px 0 10px; text-wrap: balance;
    overflow-wrap: anywhere;
  }
  .meta { display: flex; align-items: center; gap: 10px; color: var(--text2); font-weight: 700; font-size: 14px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--deck); flex: none; }
  .count { font-family: 'Sora', sans-serif; font-variant-numeric: tabular-nums; }

  /* 取り込みの導線。ここがこのページの用件なので、いちばん上に置く。 */
  .cta { margin: 24px 0 8px; display: flex; flex-wrap: wrap; gap: 12px; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 24px; border-radius: 999px;
    font-weight: 700; font-size: 15px;
    border: 1px solid var(--line); background: var(--surface);
    transition: transform .15s ease, border-color .15s ease;
    cursor: pointer; font-family: inherit; color: inherit;
  }
  .btn:hover { transform: translateY(-2px); border-color: var(--accent); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent-strong), #7C5CFF);
    color: #14121F; border: none;
  }
  .btn small { display: block; font-weight: 500; font-size: 11px; opacity: .8; }
  .note { margin-top: 14px; font-size: 13px; line-height: 1.7; color: var(--text3); }

  section { margin-top: 34px; }
  .sec-head {
    display: flex; align-items: baseline; gap: 10px;
    margin: 0 4px 12px; font-weight: 700; font-size: 15px;
  }
  .sec-head .n { font-family: 'Sora', sans-serif; font-size: 12px; color: var(--text3); font-variant-numeric: tabular-nums; }

  .grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px 10px;
    background: var(--surface2); border: 1px solid var(--line);
    border-radius: 16px; padding: 12px 12px 22px;
  }
  @media (max-width: 460px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .card { position: relative; }
  .card img, .card .blank {
    display: block; width: 100%; aspect-ratio: 5 / 7;
    border-radius: 4px; background: var(--surface3);
    object-fit: cover;
  }
  .card .blank {
    display: grid; place-items: center; padding: 4px;
    font-size: 9px; line-height: 1.3; color: var(--text3); text-align: center;
  }
  /* 枚数のバッジ。アプリのカード下端をまたぐ見せ方に合わせている。 */
  .card .n {
    position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%);
    min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 999px; background: #0B0A10; border: 1px solid var(--line);
    font-family: 'Sora', sans-serif; font-size: 11px; font-weight: 700;
    display: grid; place-items: center; font-variant-numeric: tabular-nums;
  }

  .panel {
    background: var(--surface2); border: 1px solid var(--line);
    border-radius: 16px; padding: 22px; line-height: 1.8; color: var(--text2);
  }
  .panel strong { color: var(--text); }
  .warn { color: var(--gold); font-size: 13px; margin: 0 4px 12px; line-height: 1.7; }

  footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--text3); font-size: 12px; line-height: 1.8; }
  footer a { color: var(--text2); text-decoration: underline; text-underline-offset: 3px; }
  .hidden { display: none !important; }

  /* 拡大して見るための覆い。並びの大きさでは絵柄もワザの文も読めないため。
     出すのは絵だけで、どこを触っても閉じる。 */
  .zoom {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center; padding: 20px;
    background: rgba(8, 7, 12, 0.9);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    cursor: zoom-out; animation: zoom-in .16s ease-out;
  }
  .zoom img {
    max-width: min(100%, 420px); max-height: 100%;
    border-radius: 10px; box-shadow: 0 24px 60px rgba(0,0,0,.6);
  }
  @keyframes zoom-in { from { opacity: 0; } }
  .card img { cursor: zoom-in; }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
  @media (prefers-reduced-motion: reduce) { .zoom { animation: none; } }
</style>
</head>
<body>
<div class="glow" id="glow"></div>
<div class="wrap">

  <header class="top">
    <div class="eyebrow">PokeDeck</div>
    <h1 id="title">デッキを読み込んでいます…</h1>
    <div class="meta hidden" id="meta">
      <span class="dot" id="dot"></span>
      <span class="count" id="count"></span>
    </div>
  </header>

  <div class="cta hidden" id="cta">
    <button class="btn primary hidden" id="open">アプリで開く<small>そのまま自分のデッキになります</small></button>
    <a class="btn hidden" id="play" href="https://play.google.com/store/apps/details?id=jp.egaz.pokemoncardtools" target="_blank" rel="noopener">Google Play<small>Android 版 PokeDeck</small></a>
    <a class="btn hidden" id="appstore" href="https://apps.apple.com/app/id6747426098" target="_blank" rel="noopener">App Store<small>iPhone 版 PokeDeck</small></a>
  </div>
  <p class="note hidden" id="note"></p>

  <p class="warn hidden" id="warn"></p>
  <div id="sections"></div>

  <div class="panel hidden" id="fallback"></div>

  <footer>
    <p>このページは PokeDeck で共有されたデッキを表示しています。デッキの中身はリンクそのものに入っていて、どこにも保存していません。</p>
    <p>カード画像は <a href="https://www.pokemon-card.com/" target="_blank" rel="noopener">ポケモンカードゲーム公式サイト</a> のものです。</p>
  </footer>
</div>

<script type="module">
import { decode } from './share-code.js';

// アプリが無いときの行き先。ストアへの入口は HTML 側の <a> が持っていて、
// ここは intent:// に渡すぶんだけ。App Store の方は国を指定しない形にしてある
// （開いた人の地域のストアへ Apple 側が振り分ける）。
const PLAY_URL = 'https://play.google.com/store/apps/details?id=jp.egaz.pokemoncardtools';
const APP_STORE_URL = 'https://apps.apple.com/app/id6747426098';
const PACKAGE = 'jp.egaz.pokemoncardtools';
/// アプリを直に呼ぶときの合図。Android / iOS の両方で同じ綴り。
const APP_SCHEME = 'pokedeck';
const IMAGE_BASE = 'https://www.pokemon-card.com/assets/images/card_images/large/';

// アプリの PokemonType と同じ色。デッキの色みをページにも移す。
const ENERGY_COLORS = {
  reef: '#55B24E', fire: '#F0602B', water: '#3E8FE8', thunder: '#F5CF2A',
  esper: '#A45BD1', fight: '#C9622E', dark: '#4A5670', metal: '#8C98A6',
  fairy: '#E05C9C', dragon: '#B8963A', common: '#C4C8CF',
};

// アプリのデッキ詳細と同じ並び・同じ分け方。
const SECTIONS = ['ポケモン', 'トレーナーズ', 'エネルギー', 'その他'];
// どの区分に入れるかの判定にだけ使う。並べ替えには使わない（送り手の順を保つため）。
const TRAINER_ORDER = ['グッズ', 'どうぐ', 'サポート', 'スタジアム'];
function classify(type) {
  if (type === 'ポケモン') return 'ポケモン';
  if (TRAINER_ORDER.includes(type)) return 'トレーナーズ';
  if (['基本エネルギー', '特殊エネルギー', 'エネルギー'].includes(type)) return 'エネルギー';
  return 'その他';
}

const $ = (id) => document.getElementById(id);

function showFallback(html) {
  $('title').textContent = 'デッキを開けませんでした';
  $('fallback').innerHTML = html;
  $('fallback').classList.remove('hidden');
}

/**
 * カードの索引。スタンダードぶん（130KB ほど）だけ先に読む。
 * 引けないカードがあったときにだけエクストラぶんを足しに行く。
 * 最初から両方読むと 300KB を超えて、ほとんどの人には無駄になる。
 */
let index = null;
async function loadIndex(url) {
  // **force-cache にしないこと。**
  // force-cache は期限切れでも構わずキャッシュを返す。索引にカードを足しても、
  // 一度この頁を開いたことがある人には古い索引が出続け、足したカードが
  // いつまでも「カード 49573」の灰色の枠のままになる。
  // _headers 側で max-age=300 と ETag を付けてあるので、既定の扱いに任せれば
  // 5 分は取りに行かず、そのあとも中身が変わっていなければ 304 で終わる。
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url}: ${res.status}`);
  return res.json();
}

async function main() {
  const code = new URLSearchParams(location.search).get('c');
  if (!code) {
    showFallback(
      '<strong>リンクにデッキが入っていません。</strong><br>' +
      'アドレスが途中で切れていないか確かめて、送ってくれた人にもう一度もらってください。'
    );
    return;
  }

  const deck = decode(code);
  if (!deck) {
    showFallback(
      '<strong>リンクを読めませんでした。</strong><br>' +
      'アドレスが途中で切れているか、PokeDeck の共有リンクではないようです。' +
      'メッセージアプリで改行が入って切れていることがあります。'
    );
    return;
  }

  // 中身が読めた時点で、まず取り込みの導線を出す。
  // カードの絵は 500KB の索引を待つので、それより先に押せるようにしておく。
  renderHead(deck);
  renderCta(code);

  try {
    index = await loadIndex('/cards-min.json');
    if (deck.cards.some((c) => !index[c.cardId])) {
      Object.assign(index, await loadIndex('/cards-min-extra.json'));
    }
  } catch (e) {
    // 索引が読めなくても、取り込み自体はアプリ側で完結する。
    // 絵が出ないだけなので、ページは畳まない。
    $('warn').textContent = 'カードの絵を読み込めませんでした。アプリでは正しく取り込めます。';
    $('warn').classList.remove('hidden');
    return;
  }
  renderCards(deck);
}

function renderHead(deck) {
  const color = ENERGY_COLORS[deck.energyName] || ENERGY_COLORS.common;
  document.documentElement.style.setProperty('--deck', color);
  const total = deck.cards.reduce((sum, c) => sum + c.count, 0);
  const name = deck.name.trim() || '名前のないデッキ';
  $('title').textContent = name;
  document.title = `${name} ― PokeDeck で共有されたデッキ`;
  $('count').textContent = `${total} 枚 ・ ${deck.cards.length} 種類`;
  $('meta').classList.remove('hidden');
}

/**
 * 取り込みの導線。見ている端末で出し分ける。
 *
 * **アプリを入れている人は、そもそもこのページに来ない。**
 * Android は App Links の検証が通っていればブラウザを挟まずアプリが開く。
 * ここへ来たということは、アプリが無いか、検証が効いていないかのどちらか。
 * だから店へ送る導線を主にして、「アプリで開く」はその取りこぼし用に置く。
 */
function renderCta(code) {
  const ua = navigator.userAgent;
  const isAndroid = /Android/i.test(ua);
  // iPadOS は Macintosh を名乗るので、触れる画面かどうかも見る。
  const isIOS = /iPhone|iPod/i.test(ua) ||
    (/iPad|Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);

  $('cta').classList.remove('hidden');
  if (isAndroid) $('play').classList.remove('hidden');
  else if (isIOS) $('appstore').classList.remove('hidden');
  else {
    // パソコンなど。どちらを使う人か分からないので両方出す。
    $('play').classList.remove('hidden');
    $('appstore').classList.remove('hidden');
  }

  // 「アプリで開く」は Android と iPhone に出す。パソコンには出さない。
  //
  // どちらもリンクを踏めば本来はアプリが直接開く（App Links / Universal Links）。
  // ただし LINE や X の中のブラウザはそれを無視してこのページを開いてしまう。
  // そこから来た人のための逃げ道なので、素の合図（pokedeck://）を叩く。
  if (isAndroid || isIOS) {
    $('open').classList.remove('hidden');
    $('open').addEventListener('click', () => {
      if (isAndroid) {
        // Chrome の intent:// なら、アプリが無いときの行き先まで一緒に渡せる。
        // 自前で時間を測って振り分けるより確実。
        location.href =
          `intent://d?c=${code}#Intent;scheme=pokedeck;package=${PACKAGE};` +
          `S.browser_fallback_url=${encodeURIComponent(PLAY_URL)};end`;
        return;
      }
      // iOS には intent:// が無いので、呼んでみて何も起きなければ店へ送る。
      //
      // **鳴った時刻を必ず見ること。**
      // アプリが開くと Safari は裏へ回り、この頁はタイマーごと凍らされる。
      // 凍っている間は時間が進まないので、Safari に戻ってきた瞬間に遅れて鳴る。
      // そのときはもう画面が表に戻っていて document.hidden も false なので、
      // 「鳴った＝アプリが無かった」と決めつけると、アプリを開いた人を
      // その直後に店へ飛ばしてしまう。予定より遅れて鳴ったなら、
      // その間ここは止まっていた＝アプリが前に出ていた、ということ。
      const WAIT = 1500;
      const SLACK = 400;
      const startedAt = Date.now();
      let leftPage = false;
      const markLeft = () => { leftPage = true; };
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) markLeft();
      });
      window.addEventListener('pagehide', markLeft, { once: true });
      setTimeout(() => {
        if (leftPage || document.hidden) return;
        if (Date.now() - startedAt > WAIT + SLACK) return;
        location.href = APP_STORE_URL;
      }, WAIT);
      location.href = `${APP_SCHEME}://d?c=${code}`;
    });
  }

  $('note').textContent = (isAndroid || isIOS)
    ? 'アプリを入れている人は「アプリで開く」からそのまま取り込めます。取り込んでも、送った人のデッキは変わりません。'
    : 'アプリを入れると、このデッキをそのまま自分のデッキとして取り込めます。';
  $('note').classList.remove('hidden');
}

function renderCards(deck) {
  const missing = deck.cards.filter((c) => !index[c.cardId]);
  if (missing.length > 0) {
    const count = missing.reduce((sum, c) => sum + c.count, 0);
    $('warn').textContent = `${count} 枚は、このページのカード一覧に見つかりませんでした。`;
    $('warn').classList.remove('hidden');
  }

  const groups = new Map();
  for (const entry of deck.cards) {
    const found = index[entry.cardId];
    const card = {
      count: entry.count,
      name: found ? found[0] : `カード ${entry.cardId}`,
      image: found ? found[1] : null,
      type: found ? found[2] : '',
    };
    const group = classify(card.type);
    if (!groups.has(group)) groups.set(group, []);
    groups.get(group).push(card);
  }

  // **並べ替えないこと。**
  // v2 のコードには送り手のアプリに並んでいた順がそのまま入っている。
  // 区分に振り分けても順番は崩れない（振り分けは前から順に足しているだけ）ので、
  // ここで手を入れなければ、送り手のアプリと同じ並びで出る。
  const out = document.createDocumentFragment();
  for (const name of SECTIONS) {
    const cards = groups.get(name);
    if (!cards) continue;
    out.appendChild(section(name, cards));
  }
  $('sections').appendChild(out);
}

/**
 * カードを拡大して見せる。
 *
 * 並べている絵はすでに公式の large をそのまま縮めて出しているので、
 * 拡大しても取りに行くものは無い（同じ URL がブラウザに載っている）。
 *
 * **戻るで閉じられるようにしておくこと。** 携帯でこの頁を開く人は
 * LINE や X から来ていて、拡大したまま戻るを押すとデッキごと消えてしまう。
 * 履歴を 1 つ積んでおけば、戻るは「拡大を閉じる」で終わる。
 */
function setUpZoom() {
  let layer = null;

  function open(src, alt) {
    if (layer) return;
    layer = document.createElement('div');
    layer.className = 'zoom';
    const img = document.createElement('img');
    img.src = src;
    img.alt = alt;
    layer.appendChild(img);
    layer.addEventListener('click', () => close());
    document.body.appendChild(layer);
    document.body.style.overflow = 'hidden';
    history.pushState({ zoom: true }, '');
  }

  function close({ back = true } = {}) {
    if (!layer) return;
    layer.remove();
    layer = null;
    document.body.style.overflow = '';
    // 触って閉じたときは、積んだ履歴も戻して辻褄を合わせる。
    // 戻るで閉じたときは既に戻っているので、もう一度戻すと頁を離れてしまう。
    if (back && history.state && history.state.zoom) history.back();
  }

  const from = (target) => {
    const cell = target.closest('.card');
    const img = cell && cell.querySelector('img');
    if (img) open(img.src, img.alt);
  };

  $('sections').addEventListener('click', (e) => from(e.target));
  $('sections').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    from(e.target);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') close();
  });
  window.addEventListener('popstate', () => close({ back: false }));
}

function section(name, cards) {
  const el = document.createElement('section');
  const head = document.createElement('div');
  head.className = 'sec-head';
  head.innerHTML = `<span></span><span class="n"></span>`;
  head.children[0].textContent = name;
  head.children[1].textContent = cards.reduce((sum, c) => sum + c.count, 0);
  el.appendChild(head);

  const grid = document.createElement('div');
  grid.className = 'grid';
  for (const card of cards) {
    const cell = document.createElement('div');
    cell.className = 'card';
    if (card.image) {
      // 絵があるものだけ拡大できる。引けなかったカードは押しても何も無いので触らせない。
      cell.tabIndex = 0;
      cell.setAttribute('role', 'button');
      cell.setAttribute('aria-label', `${card.name}を大きく見る`);
      const img = document.createElement('img');
      img.src = IMAGE_BASE + card.image;
      img.alt = card.name;
      img.loading = 'lazy';
      img.decoding = 'async';
      cell.appendChild(img);
    } else {
      const blank = document.createElement('div');
      blank.className = 'blank';
      blank.textContent = card.name;
      cell.appendChild(blank);
    }
    const n = document.createElement('span');
    n.className = 'n';
    n.textContent = card.count;
    cell.appendChild(n);
    grid.appendChild(cell);
  }
  el.appendChild(grid);
  return el;
}

setUpZoom();
main();
</script>
</body>
</html>
