name: update-cards

on:
  schedule:
    # 毎日 03:10 JST（= 18:10 UTC）。公式サイトの更新は日中なので夜間に回す。
    - cron: "10 18 * * *"
    # 毎日 15:00 JST（= 06:00 UTC）。公式は昼にカードを追加することが多く、
    # 夜間の巡回まで待つと知らせるのが丸一日遅れる。
    # **通知を出すのはこちらの回だけ**（深夜 3 時に通知を飛ばさないため）。
    # 差分取得なので、新しいカードが無い日は一覧の走査だけで 30 秒ほどで終わる。
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      refresh_all:
        # 「取得し直す」とだけ書くと毎回ゼロから始まるように読めるが、実際は
        # data/refresh-progress.json に進捗が残っていて続きから走る。
        # 取り切るまでは毎回チェックを入れること。外すと進捗が読まれない。
        description: "全件の取り直しを進める（前回の続きから。取り切るまで毎回チェック）"
        type: boolean
        default: false
      notify_test_only:
        # 送信部の確認用。**自分の端末 1 台にだけ**届く。
        # トピックではなく Secrets の FCM_TEST_TOKEN が指す端末へ送るので、
        # 本番と同じ経路（JWT → access token → FCM）をそのまま試せる。
        # 増えたカードが無い日でも見本を 1 通作って送り、控えは進めない。
        description: "通知を自分の端末 1 台にだけ送る（確認用）"
        type: boolean
        default: false
      notify_dry_run:
        # 文面だけ確かめたいとき。差分と本文を表示するだけで、送信も控えの更新もしない。
        # **誤って送ると取り消せない**ので、文面を変えたときは必ず一度これで見ること。
        description: "通知は送らず、文面だけ表示する"
        type: boolean
        default: false
      max_fetch:
        # エクストラの初回取り込みは 1 万件を超える。日次の 1000 件のままだと
        # 13 日かかるので、手で回すときだけ上げられるようにしておく。
        # 1 件 1 秒なので、ジョブの上限 330 分に収まるのは 15,000 件あたりまで。
        description: "1 回の実行で取得する上限（1 件 1 秒。既定 1000）"
        type: string
        default: "1000"

# 同時に走ると data/cards.json の書き込みが競合するため直列化する
concurrency:
  group: update-cards
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # 公式サイトの WAF に当たると 403 になる。その場合スクリプトは
      # 取得済みの分を保存して終了コード 75 を返すので、ジョブは失敗扱いにせず
      # コミットまで進める（続きは次回の実行で再開される）。
      - name: Build card data
        id: build
        env:
          CONCURRENCY: "1"
          DELAY_MS: "1000"
          MAX_FETCH: ${{ inputs.max_fetch || '1000' }}
          REFRESH_ALL: ${{ inputs.refresh_all && '1' || '0' }}
        run: |
          set +e
          npm run build
          code=$?
          set -e
          if [ "$code" -eq 75 ]; then
            echo "partial=true" >> "$GITHUB_OUTPUT"
            echo "::warning::アクセス制限により途中で中断した。取得済みの分をコミットする。"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data public; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "更新なし"
            exit 0
          fi
          version=$(node -p "require('./data/state.json').version")
          count=$(node -p "require('./data/cards.json').length")
          # エクストラはまだ揃っていない間 extraVersion が 0 のままなので、
          # 件数だけをコミットメッセージに添える。
          extra=$(node -p "const fs=require('fs');fs.existsSync('./data/cards-extra.json')?require('./data/cards-extra.json').length:0")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public
          suffix=""
          if [ "${{ steps.build.outputs.partial }}" = "true" ]; then suffix=" [途中]"; fi
          extra_note=""
          if [ "$extra" -gt 0 ]; then extra_note=" +エクストラ${extra}件"; fi
          git commit -m "カードデータ更新 v${version} (${count}件${extra_note})${suffix}"
          # 全件更新は 1 回が数時間かかる。その間にこのブランチへ別のコミットが
          # 入っていると push が弾かれ、取得済みのデータがランナーごと消える。
          # 実際 2026-08-31 の 8,000 件の実行がこれで丸ごと無駄になった。
          # データの変更は data/ と public/ にしか無いので、取り込み直して押す。
          pushed=false
          for _ in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=true; break; fi
            echo "::warning::push が弾かれた。取り込み直して再試行する。"
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          if [ "$pushed" != true ]; then exit 1; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      # カードが増えていたらアプリへ通知する。
      #
      # **コミットの後に置くこと。** 押す前に通知すると、まだ配信されていない
      # カードを見に来させることになる（Cloudflare はこのリポジトリから配る）。
      #
      # **steps.commit の結果で条件を付けないこと。** 深夜の回が先に見つけていた場合、
      # 昼の回は「変化なし」になるが、まだ知らせていないぶんが残っている。
      # 通知するかどうかは data/notified.json との差だけで決める。
      - name: Notify card update
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * *'
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DELAY_MS: "1000"
          DRY_RUN: ${{ inputs.notify_dry_run && '1' || '0' }}
          # 確認用のときだけ宛先を 1 台に絞る。
          # 印（NOTIFY_TEST_ONLY）も一緒に渡すこと。トークンが空のまま進むと
          # 宛先がトピックへ落ちて全員に飛ぶので、notify 側が印を見て止める。
          NOTIFY_TEST_ONLY: ${{ inputs.notify_test_only && '1' || '0' }}
          FCM_TEST_TOKEN: ${{ inputs.notify_test_only && secrets.FCM_TEST_TOKEN || '' }}
        run: npm run notify

      - name: Commit notified.json
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * *'
        run: |
          if git diff --quiet -- data/notified.json; then
            echo "通知の控えに変化なし"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notified.json
          git commit -m "通知した時点のカードプールを控える"
          for _ in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1

      - name: Notify Discord
        if: steps.commit.outputs.changed == 'true' && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -sS -X POST -H "Content-Type: application/json" \
            -d "$(node -pe 'JSON.stringify({content: process.argv[1]})' \
                  "カードデータを更新しました v${{ steps.commit.outputs.version }}（全 ${{ steps.commit.outputs.count }} 件）")" \
            "$DISCORD_WEBHOOK_URL"

      - name: Notify Discord on failure
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -sS -X POST -H "Content-Type: application/json" \
            -d '{"content":"カードデータの更新に失敗しました。Actions のログを確認してください。"}' \
            "$DISCORD_WEBHOOK_URL"
